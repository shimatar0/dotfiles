[general]
import = [
    "~/.config/alacritty/themes/themes/duskfox.toml"
]

[window]
resize_increments = true  
dynamic_padding   = true
padding = { x = 0, y = 0 } # 固定パディング
# padding = { x = 4, y = 2 }
opacity = 1.0
blur = true
decorations_theme_variant = 'dark'

[scrolling]
history = 100000
multiplier = 5

[font]
size = 12.0
offset = { x = 0, y = 4 }
normal = { family = "JetBrainsMono Nerd Font Mono", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font Mono", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font Mono", style = "Bold Italic" }

[terminal]
shell = { program = "/bin/zsh", args = ["-l", "-c", "tmux a -t 0 || tmux"] }
